name: Publicar

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-20.04
    steps:

    - name: Obtener el proyecto
      uses: actions/checkout@v2
      with:
          persist-credentials: false

    - name: Configurar Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.7

    - name: Instalar dependencias (nativas)
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install pkg-config libxml2-dev libxslt-dev
        # asciidoctor-diagram
        sudo apt-get install default-jre graphviz
        # asciidoctor-mathematical
        sudo apt-get install bison flex libffi-dev libxml2-dev libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev fonts-lyx cmake

    - name: Instalar dependencias (gemas)
      run: |
        bundle config set --local path vendor/bundle
        bundle config set --local build.nokogiri --use-system-libraries
        bundle config set --local without epub3
        bundle config set --local deployment true
        bundle install

    - name: Generar la documentación
      run: bundle exec rake build:pdf

    - name: Empaquetar la documentación
      run: find output/pdf/* -type f -iname '*.pdf' | zip -j  output/pdf/desarrollo3d-pdf.zip -@

    - name: Publicar en 'Releases'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: output/pdf/{*/*.pdf,*.zip}
        tag: ${{ github.ref }}
        file_glob: true
        release_name: "Curso 20XX-20XY"
        body: "Apuntes de Desarrollo de Videojuegos 3D del curso 20XX-20XY."
        overwrite: true
        prerelease: true
