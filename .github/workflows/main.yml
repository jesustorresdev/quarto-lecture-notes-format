name: Publicar

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Obtener el proyecto
      uses: actions/checkout@v4

    - id: dotenv
      name: Leer variables de entorno
      uses: falti/dotenv-action@v1.1.4
      with:
        path: ./_environment-production
        log-variables: true

    - name: Configurar Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Publicar en GitHub Pages
      uses: quarto-dev/quarto-actions/publish@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QUARTO_PROFILE: production
      with:
        target: gh-pages

    - name: Empaquetar la documentación
      run: cd _book && zip -r ../desarrollo3d.zip *

    - name: Publicar en 'Releases'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        file: desarrollo3d.zip
        body: "Apuntes de Desarrollo de Videojuegos 3D del curso ${{ steps.dotenv.outputs.academic_year }}."
        release_name: "Curso ${{ steps.dotenv.outputs.academic_year }}"
        prerelease: true
        overwrite: true
