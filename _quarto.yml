project:
  type: book
  resources: 
    - assets/*

book:
  title: Desarrollo de Videojuegos 3D
  subtitle: Master Universitario en Desarrollo de Videojuegos de la Universidad de La Laguna (Cursos 2024/2025)
  date: today
  author:
    - name: Jesús Torres
      email: jmtorres@ull.es
  publisher: Universidad de La Laguna
  page-footer: |
    Este trabajo está bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)
    <img style="height:16px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt="">
    <img style="height:16px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1" alt=""></a> 
  # abstract: 
  chapters: 
    - index.qmd
    - part: Workflow
      chapters: 
        - chapters/motores.qmd
    - part: Animación
      chapters:
        - chapters/motion-matching.qmd
    - part: Unreal Engine
      chapters:
        - chapters/unreal-core.qmd
        - chapters/unreal-gameplay-framework.qmd
        - chapters/unreal-level-blueprint.qmd
        - chapters/unreal-damage-api.qmd
        - chapters/unreal-load-levels.qmd
        - chapters/unreal-save-game.qmd
        - chapters/unreal-timers.qmd
        - chapters/unreal-tick-and-pause.qmd
        - chapters/unreal-data-driven.qmd
  appendices:
    - chapters/perforce.qmd

lang: es
toc-title: Contenidos
callout-appearance: simple
crossref:
  title-delim: ":"
  custom:
    - kind: float
      reference-prefix: Vídeo
      key: vid

bibliography: references/references.bib
csl: references/elsevier-with-titles.csl
reference-section-title: Referencias

api-reference:
  path: references/api.yml
  reference-section-title: Referencias a la API
  markers:
    class: "{{< iconify ph cube-bold >}}"
    event: "{{< iconify ph lightning-bold >}}"
    function: "{{< iconify ph function-bold >}}"
    method: "{{< iconify ph function-bold >}}"
    static: "{{< iconify ph function-square-bold >}}"
    cpp: "{{< iconify devicon-plain cplusplus title='C++' >}}"
    bp: "{{< iconify simple-icons blueprint title='Blueprint' >}}"

filters:
  - reading-time
  - quarto
  - api-reference
  - section-bibliographies

format:
  html:
    css: styles.css
    number-sections: true
    number-depth: 3
    anchor-sections: true
    smooth-scroll: true
    html-math-method: katex
    mermaid:
      theme: default
    include-in-header: 
      text: '<meta name="robots" content="noindex, nofollow">'
    resources:
      - robots.txt