project:
  type: book

book:
  title: Desarrollo de Videojuegos 3D
  subtitle: Master Universitario en Desarrollo de Videojuegos de la Universidad de La Laguna (Cursos 20XX/20XY)
  date: today
  author:
    - name: Jesús Torres
      email: jmtorres@ull.es
  publisher: Universidad de La Laguna
  license: Este trabajo está bajo una licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es).
  page-footer: "Este trabajo está bajo una licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)." 
  # abstract: 
  chapters: 
    - index.qmd
    - part: Workflow
    - part: Animación
      chapters:
        - content/animación/motion_matching.qmd
  # appendices:

lang: es
toc-title: Contenidos
crossref:
  title-delim: ":"
  custom:
    - kind: float
      reference-prefix: Video
      key: vid

bibliography: references/references.bib
csl: references/acm-sig-proceedings.csl
reference-section-title: Referencias
api-reference: 
  path: references/api.yml

filters:
  - reading-time
  - quarto
  - api-reference
  - section-bibliographies

format:
  html:
    css: styles.css
    number-sections: true
    number-depth: 3
    anchor-sections: true
    smooth-scroll: true
    html-math-method: katex
    include-in-header: 
      text: '<meta name="robots" content="noindex, nofollow" />'
    resources:
      - robots.txt