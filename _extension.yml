title: Formato de notas de clase
description: Extensión de fomato para los documentos de notas de clase de Jesús Torres
author: Jesús Torres
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    common:
      toc: true
      toc-title: Contenidos
      reference-section-title: Referencias
      number-sections: true
      number-depth: 3
      callout-appearance: simple
      crossref:
        title-delim: ":"
        custom:
          - kind: float
            reference-prefix: Vídeo
            key: vid
      filters:
        - reading-time
        - quarto
        - api-reference
        - pwa
      shortcodes:
        - api-reference
        - coatless-quarto/embedio
        - mcanouil/iconify
      api-reference:
        reference-section-title: Referencias a la API
        types:
          class:
            title: clase
            marker: "{{< iconify ph cube-bold >}}"
          struct:
            title: estructura
            marker: "{{< iconify ph brackets-curly-bold >}}"
          enum:
            title: enumeración
            marker: "{{< iconify ph list-light >}}"
          function:
            title: función
            marker: "{{< iconify ph function-bold >}}"
          method:
            title: método
            marker: "{{< iconify ph function-bold >}}"
        langs:
          cpp:
            title: C++
            marker: "{{< iconify devicon-plain cplusplus title='C++' >}}"
    html:
      theme: [default, custom.scss]
      mermaid:
        theme: default
      anchor-sections: true
      smooth-scroll: true
      html-math-method: katex
